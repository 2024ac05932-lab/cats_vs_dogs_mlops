name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        run: pytest tests/

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            rajanvesangi/cats-dogs-classifier:latest
            rajanvesangi/cats-dogs-classifier:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Pull latest image and restart
        run: |
          docker pull rajanvesangi/cats-dogs-classifier:latest
          docker-compose down
          docker-compose up -d --force-recreate
        shell: cmd
      - name: Smoke test (health)
        run: curl -f http://localhost:8000/health || exit 1
        shell: cmd
      - name: Smoke test (prediction)
        run: curl -f -X POST http://localhost:8000/predict -F "file=@data/raw/dog/dog.5.jpg" || exit 1
        shell: cmd