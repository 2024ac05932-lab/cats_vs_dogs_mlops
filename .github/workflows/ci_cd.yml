- name: Smoke test (health)
        shell: powershell
        run: |
          $maxRetries = 10
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
              try {
                  $response = Invoke-RestMethod -Uri "http://localhost:8000/health" -TimeoutSec 2
                  if ($response.status -eq "ok") {
                      Write-Host "Health check passed!"
                      exit 0
                  }
              } catch {
                  Write-Host "Waiting for app to start... (Attempt $($retryCount + 1)/$maxRetries)"
                  Start-Sleep -Seconds 3
                  $retryCount++
              }
          }
          Write-Error "Health check failed after $maxRetries attempts."
          exit 1