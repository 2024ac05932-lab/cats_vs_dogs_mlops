name: CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build -t cats-dogs-api .

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Pull latest image and restart
        run: |
          docker-compose down
          docker-compose up -d --build

      - name: Smoke test (health)
        shell: powershell
        run: |
          Write-Host "Waiting 15 seconds for TensorFlow and FastAPI to initialize..."
          Start-Sleep -Seconds 15
          curl.exe -f http://localhost:8000/health
